x-memory-service: &memory-service
  MEMSTATION_DELETION_JOURNAL_KEY: ${MEMSTATION_DELETION_JOURNAL_KEY:-}
  MEMSTATION_MEMORY_PROCESSING_ENTITY_RECALL_TIMEOUT_MS: ${MEMSTATION_MEMORY_PROCESSING_ENTITY_RECALL_TIMEOUT_MS:-200}
  MEMSTATION_MEMORY_PROCESSING_STRATEGY: ${MEMSTATION_MEMORY_PROCESSING_STRATEGY:-generative}
  MEMSTATION_MEMORY_PROCESSING_ENDPOINT: ${MEMSTATION_MEMORY_PROCESSING_ENDPOINT:-http://extractor:8092}
  MEMSTATION_MEMORY_PROCESSING_TOKEN: ${MEMSTATION_MEMORY_PROCESSING_TOKEN:-memstation-local-extractor-token}
  MEMSTATION_MEMORY_PROCESSING_MODEL: ${MEMSTATION_MEMORY_PROCESSING_MODEL:-fastino/gliner2.5-multi-v1}
  MEMSTATION_MEMORY_PROCESSING_REVISION: ${MEMSTATION_MEMORY_PROCESSING_REVISION:-cf5593a5d45e3bbf204b9df621b13b1c0cf25ee3}
  MEMSTATION_MEMORY_PROCESSING_SPLITTER: ${MEMSTATION_MEMORY_PROCESSING_SPLITTER:-char}
  MEMSTATION_MEMORY_PROCESSING_THRESHOLD: ${MEMSTATION_MEMORY_PROCESSING_THRESHOLD:-0.75}
  MEMSTATION_MEMORY_PROCESSING_AUDIT_RATE: ${MEMSTATION_MEMORY_PROCESSING_AUDIT_RATE:-0.1}
  MEMSTATION_MEMORY_PROCESSING_MAX_SEMANTIC_BYTES: ${MEMSTATION_MEMORY_PROCESSING_MAX_SEMANTIC_BYTES:-131072}
  MEMSTATION_MEMORY_AI_BACKEND: ${MEMSTATION_MEMORY_AI_BACKEND:-direct}
  MEMSTATION_MEMORY_BROKER_BASE_URL: ${MEMSTATION_MEMORY_BROKER_BASE_URL:-}
  MEMSTATION_MEMORY_BROKER_CREDENTIAL: ${MEMSTATION_MEMORY_BROKER_CREDENTIAL:-}
  MEMSTATION_MEMORY_BROKER_SUMMARY_ALIAS: ${MEMSTATION_MEMORY_BROKER_SUMMARY_ALIAS:-memory.summary}
  MEMSTATION_MEMORY_BROKER_ANALYSIS_ALIAS: ${MEMSTATION_MEMORY_BROKER_ANALYSIS_ALIAS:-memory.analysis}
  MEMSTATION_MEMORY_BROKER_EMBEDDING_ALIAS: ${MEMSTATION_MEMORY_BROKER_EMBEDDING_ALIAS:-memory.embedding}
  MEMSTATION_MEMORY_BROKER_RERANK_ALIAS: ${MEMSTATION_MEMORY_BROKER_RERANK_ALIAS:-memory.rerank}
  MEMSTATION_MEMORY_BROKER_EMBEDDING_MODEL: ${MEMSTATION_MEMORY_BROKER_EMBEDDING_MODEL:-}
  MEMSTATION_MEMORY_BROKER_EMBEDDING_DIMENSIONS: ${MEMSTATION_MEMORY_BROKER_EMBEDDING_DIMENSIONS:-0}
  MEMSTATION_MEMORY_BROKER_EMBEDDING_FINGERPRINT: ${MEMSTATION_MEMORY_BROKER_EMBEDDING_FINGERPRINT:-}
  MEMSTATION_INGESTION_WINDOW_BUDGET: ${MEMSTATION_INGESTION_WINDOW_BUDGET:-8192}

services:
  extractor:
    build:
      context: ../..
      dockerfile: apps/extractor/Dockerfile
      args:
        EXTRACTOR_BACKEND: ${MEMSTATION_EXTRACTOR_BACKEND:-gliner}
    environment:
      MEMSTATION_EXTRACTOR_HOST: 0.0.0.0
      MEMSTATION_EXTRACTOR_BACKEND: ${MEMSTATION_EXTRACTOR_BACKEND:-gliner}
      MEMSTATION_EXTRACTOR_TOKEN: ${MEMSTATION_MEMORY_PROCESSING_TOKEN:-memstation-local-extractor-token}
      MEMSTATION_EXTRACTOR_MODEL: ${MEMSTATION_MEMORY_PROCESSING_MODEL:-fastino/gliner2.5-multi-v1}
      MEMSTATION_EXTRACTOR_REVISION: ${MEMSTATION_MEMORY_PROCESSING_REVISION:-cf5593a5d45e3bbf204b9df621b13b1c0cf25ee3}
      MEMSTATION_EXTRACTOR_SPLITTER: ${MEMSTATION_MEMORY_PROCESSING_SPLITTER:-char}
      MEMSTATION_EXTRACTOR_MODEL_PATH: /models/uie
      HF_HOME: /models/huggingface
    volumes:
      - extractor-models:/models
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health/ready',timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 5
  workspace:
    build:
      context: ../..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    working_dir: /workspace/memstation
    environment:
      <<: *memory-service
      MEMSTATION_PORT: 8080
      MEMSTATION_GRPC_PORT: 9090
      DATABASE_URL: postgres://memstation:memstation_dev@postgres:5432/memstation?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      VECTOR_STORE_BACKEND: pgvector
      MEMSTATION_DELETION_JOURNAL_PATH: /var/lib/memstation-deletions/history.jsonl
      MEMSTATION_ADMIN_TOKEN: ${MEMSTATION_ADMIN_TOKEN:-memstation-local-admin-token}
      MEMSTATION_MASTER_KEY: ${MEMSTATION_MASTER_KEY:-memstation-local-master-key}
      MEMSTATION_CORS_ALLOWED_ORIGINS: ${MEMSTATION_CORS_ALLOWED_ORIGINS:-}
      MEMSTATION_SESSION_COOKIE_SECURE: "false"
      MEMSTATION_SESSION_COOKIE_CROSS_SITE: "false"
    ports:
      - "${MEMSTATION_HTTP_BIND:-127.0.0.1}:8080:8080"
      - "${MEMSTATION_GRPC_BIND:-127.0.0.1}:9090:9090"
      - "127.0.0.1:5173:5173"
    volumes:
      - ../..:/workspace/memstation
      - deletion-journal:/var/lib/memstation-deletions
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  memstation:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    environment:
      <<: *memory-service
      MEMSTATION_PORT: 8080
      MEMSTATION_GRPC_PORT: 9090
      DATABASE_URL: postgres://memstation:memstation_dev@postgres:5432/memstation?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      VECTOR_STORE_BACKEND: pgvector
      MEMSTATION_DELETION_JOURNAL_PATH: /var/lib/memstation-deletions/history.jsonl
      MEMSTATION_PUBLIC_BASE_URL: ${MEMSTATION_PUBLIC_BASE_URL:-http://127.0.0.1:8080}
      CHAT_MODEL: ${CHAT_MODEL:-}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-}
      ANALYSIS_MODEL: ${ANALYSIS_MODEL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      MEMSTATION_ADMIN_TOKEN: ${MEMSTATION_ADMIN_TOKEN:-memstation-local-admin-token}
      MEMSTATION_MASTER_KEY: ${MEMSTATION_MASTER_KEY:-memstation-local-master-key}
      MEMSTATION_CORS_ALLOWED_ORIGINS: ${MEMSTATION_CORS_ALLOWED_ORIGINS:-}
      MEMSTATION_SESSION_COOKIE_SECURE: "false"
      MEMSTATION_SESSION_COOKIE_CROSS_SITE: "false"
    ports:
      - "${MEMSTATION_HTTP_BIND:-127.0.0.1}:8080:8080"
      - "${MEMSTATION_GRPC_BIND:-127.0.0.1}:9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - deletion-journal:/var/lib/memstation-deletions
    command: ["serve"]

  worker:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    environment:
      <<: *memory-service
      DATABASE_URL: postgres://memstation:memstation_dev@postgres:5432/memstation?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      VECTOR_STORE_BACKEND: pgvector
      MEMSTATION_DELETION_JOURNAL_PATH: /var/lib/memstation-deletions/history.jsonl
      MEMSTATION_ADMIN_TOKEN: ${MEMSTATION_ADMIN_TOKEN:-memstation-local-admin-token}
      MEMSTATION_MASTER_KEY: ${MEMSTATION_MASTER_KEY:-memstation-local-master-key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - deletion-journal:/var/lib/memstation-deletions
    command: ["worker"]

  scheduler:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    environment:
      <<: *memory-service
      DATABASE_URL: postgres://memstation:memstation_dev@postgres:5432/memstation?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      VECTOR_STORE_BACKEND: pgvector
      MEMSTATION_DELETION_JOURNAL_PATH: /var/lib/memstation-deletions/history.jsonl
      MEMSTATION_ADMIN_TOKEN: ${MEMSTATION_ADMIN_TOKEN:-memstation-local-admin-token}
      MEMSTATION_MASTER_KEY: ${MEMSTATION_MASTER_KEY:-memstation-local-master-key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - deletion-journal:/var/lib/memstation-deletions
    command: ["scheduler"]

  manager:
    build:
      context: ../..
      dockerfile: apps/manager/Dockerfile
    environment:
      ORIGIN: ${MEMSTATION_MANAGER_ORIGIN:-http://127.0.0.1:4173}
      MEMSTATION_MANAGER_TARGETS: '[{"id":"local","label":"Local","baseUrl":"http://memstation:8080","allowPrivateNetwork":true}]'
      MEMSTATION_MANAGER_REDIS_URL: redis://redis:6379/1
      MEMSTATION_MANAGER_SESSION_KEY: ${MEMSTATION_MANAGER_SESSION_KEY:-}
    ports:
      - "${MEMSTATION_MANAGER_BIND:-127.0.0.1}:4173:3000"
    depends_on:
      memstation:
        condition: service_started
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: memstation
      POSTGRES_PASSWORD: memstation_dev
      POSTGRES_DB: memstation
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memstation -d memstation"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../otel/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

volumes:
  extractor-models:
  deletion-journal:
  postgres-data:
  redis-data:
