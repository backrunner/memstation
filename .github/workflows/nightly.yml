name: nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  drills:
    runs-on: ubuntu-latest
    env:
      MEMSTATION_RECOVERY_MAX_DRAIN: "20s"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Run worker recovery nightly drill
        run: bash ./scripts/ops/run-worker-recovery-nightly.sh "$RUNNER_TEMP/memstation-nightly-recovery"
      - name: Run backup/restore nightly drill
        run: bash ./scripts/ops/run-backup-restore-drill.sh --out-dir "$RUNNER_TEMP/memstation-backup-drill"
      - name: Upload nightly artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memstation-nightly-ops-artifacts
          path: |
            ${{ runner.temp }}/memstation-nightly-recovery
            ${{ runner.temp }}/memstation-backup-drill
