name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      MEMSTATION_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      MEMSTATION_SERVER_COVERAGE_THRESHOLD: "55"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.3
          cache-dependency-path: apps/server/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
          cache: pnpm
      - uses: ariga/setup-atlas@v0
        with:
          # Atlas v0.38+ requires Pro for migrate lint; keep CI on the last CE lint-capable release.
          version: v0.37.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Atlas migration lint and dry-run
        run: bash ./scripts/ops/check-atlas-migrations.sh
      - name: Migrate disposable integration database
        run: atlas migrate apply --dir file://apps/server/ent/migrate/migrations --url "$MEMSTATION_TEST_DATABASE_URL"
      - name: Go test
        run: cd apps/server && go test ./...
      - name: Go format check
        run: bash ./scripts/go/format.sh --check
      - name: golangci-lint
        run: bash ./scripts/go/lint.sh
      - name: Go generate check
        run: cd apps/server && go generate ./... && git diff --exit-code
      - name: Contract tests
        run: bash ./scripts/test/run-contract-tests.sh
      - name: Worker recovery smoke
        run: bash ./scripts/ops/run-worker-recovery-smoke.sh "$RUNNER_TEMP/memstation-recovery"
      - name: Backup/restore drill dry-run
        run: bash ./scripts/ops/run-backup-restore-drill.sh --dry-run --out-dir "$RUNNER_TEMP/memstation-backup-drill"
      - name: pnpm lint
        run: pnpm lint
      - name: pnpm test
        run: pnpm test
      - name: Coverage thresholds
        run: bash ./scripts/test/check-coverage.sh
      - name: Install Playwright browser
        run: cd apps/manager && pnpm exec playwright install --with-deps chromium webkit
      - name: Manager Playwright E2E
        run: pnpm test:e2e:manager
      - name: Upload ops artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: memstation-ops-artifacts
          retention-days: 3
          path: |
            ${{ runner.temp }}/memstation-recovery
            ${{ runner.temp }}/memstation-backup-drill
      - name: Upload manager Playwright artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: manager-playwright-artifacts
          retention-days: 3
          path: |
            apps/manager/test-results
            apps/manager/playwright-report
